services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongodb

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongodb_data:
  uploads:

